name: Bug report
description: Something in Scroll Less is not working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Scroll Less better. A few quick details and we can track it down.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
      placeholder: When I tapped X, the app did Y. I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      description: How can we make it happen again? One step per line.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Found in Settings. Filled in for you when you report from inside the app.
      placeholder: 0.1.3-Beta
    validations:
      required: false
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 14
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Pixel 7
    validations:
      required: false
